<title>Request Flow Diagram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --fg: #1b1d1f;
    --muted: #6b6f76;
    --line: #d7d4cc;
    --accent: #c0562e;
    --accent-soft: #f3e2d8;
    font-family: Inter, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a;
      --surface: #1d2023;
      --fg: #eceae6;
      --muted: #96999f;
      --line: #35383d;
      --accent: #e0793f;
      --accent-soft: #3a2a20;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a;
    --surface: #1d2023;
    --fg: #eceae6;
    --muted: #96999f;
    --line: #35383d;
    --accent: #e0793f;
    --accent-soft: #3a2a20;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 56px;
  }

  main { max-width: 980px; margin: 0 auto; }

  h1 {
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    letter-spacing: -0.01em;
    margin: 0 0 24px;
    text-wrap: balance;
  }

  h2 {
    font-size: 1.05rem;
    margin: 0 0 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  h2 .tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
  }

  figure { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 16px; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }

  section { margin-bottom: 40px; }
  section:last-child { margin-bottom: 0; }

  .node-label { font-family: "JetBrains Mono", monospace; font-size: 11.5px; font-weight: 500; }
  .node-sub { font-family: "JetBrains Mono", monospace; font-size: 9.5px; opacity: 0.72; }
  .edge-label { font-family: "JetBrains Mono", monospace; font-size: 10.5px; }
</style>

<main>
  <h1>Request flow: nam-web</h1>

  <section>
    <h2>Figure 1 <span class="tag">page load / GraphQL query</span></h2>
    <figure>
      <svg viewBox="0 0 1300 420" role="img" aria-label="Browser requests a page through CloudFront, which serves cached static assets from S3 directly or forwards to an ALB in front of an ECS Fargate task running the Next.js server; that server calls API Gateway, which invokes a Provisioned-Concurrency Lambda alias that reads DynamoDB; the GraphQL response and rendered page travel back the same path to the browser.">
        <defs>
          <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <g stroke="currentColor" fill="none">
          <line x1="170" y1="88" x2="236" y2="88" marker-end="url(#arrow1)" />
          <line x1="390" y1="88" x2="456" y2="88" marker-end="url(#arrow1)" />
          <line x1="610" y1="88" x2="676" y2="88" marker-end="url(#arrow1)" />
          <line x1="830" y1="88" x2="896" y2="88" marker-end="url(#arrow1)" />
          <line x1="1050" y1="88" x2="1116" y2="88" marker-end="url(#arrow1)" />
        </g>
        <text x="203" y="78" text-anchor="middle" class="edge-label" fill="currentColor">HTTPS GET</text>
        <text x="423" y="78" text-anchor="middle" class="edge-label" fill="currentColor">cache miss</text>
        <text x="643" y="78" text-anchor="middle" class="edge-label" fill="currentColor">HTTP :80</text>
        <text x="863" y="78" text-anchor="middle" class="edge-label" fill="currentColor">fetch()</text>
        <text x="1083" y="78" text-anchor="middle" class="edge-label" fill="currentColor">invoke</text>

        <g>
          <rect x="20" y="60" width="150" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="95" y="83" text-anchor="middle" class="node-label" fill="currentColor">Browser</text>
          <text x="95" y="98" text-anchor="middle" class="node-sub" fill="currentColor">page / RSC request</text>
        </g>
        <g>
          <rect x="236" y="60" width="154" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="313" y="83" text-anchor="middle" class="node-label" fill="currentColor">CloudFront</text>
          <text x="313" y="98" text-anchor="middle" class="node-sub" fill="currentColor">edge, 2 origins</text>
        </g>
        <g>
          <rect x="456" y="60" width="154" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="533" y="83" text-anchor="middle" class="node-label" fill="currentColor">ALB</text>
          <text x="533" y="98" text-anchor="middle" class="node-sub" fill="currentColor">nam-web, public</text>
        </g>
        <g>
          <rect x="676" y="60" width="154" height="56" rx="10" fill="none" stroke="var(--accent)" stroke-width="2" />
          <text x="753" y="80" text-anchor="middle" class="node-label" fill="currentColor">ECS Fargate</text>
          <text x="753" y="95" text-anchor="middle" class="node-sub" fill="currentColor">Next.js SSR, min=1</text>
        </g>
        <g>
          <rect x="896" y="60" width="154" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="973" y="80" text-anchor="middle" class="node-label" fill="currentColor">API Gateway</text>
          <text x="973" y="95" text-anchor="middle" class="node-sub" fill="currentColor">HTTP API</text>
        </g>
        <g>
          <rect x="1116" y="60" width="154" height="56" rx="10" fill="none" stroke="var(--accent)" stroke-width="2" />
          <text x="1193" y="80" text-anchor="middle" class="node-label" fill="currentColor">λ api : live</text>
          <text x="1193" y="95" text-anchor="middle" class="node-sub" fill="currentColor">Provisioned Conc. ×1</text>
        </g>

        <line x1="313" y1="116" x2="313" y2="180" stroke="currentColor" fill="none" marker-end="url(#arrow1)" />
        <text x="330" y="150" class="edge-label" fill="currentColor">cache hit</text>
        <rect x="236" y="196" width="154" height="56" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3" />
        <text x="313" y="219" text-anchor="middle" class="node-label" fill="currentColor">S3 (OAC)</text>
        <text x="313" y="234" text-anchor="middle" class="node-sub" fill="currentColor">/_next/static/*, 1yr TTL</text>

        <line x1="1193" y1="116" x2="1193" y2="200" stroke="currentColor" fill="none" marker-end="url(#arrow1)" />
        <text x="1215" y="162" class="edge-label" fill="currentColor">Query / GetItem</text>
        <rect x="1116" y="216" width="154" height="56" rx="10" fill="none" stroke="currentColor" />
        <text x="1193" y="239" text-anchor="middle" class="node-label" fill="currentColor">DynamoDB</text>
        <text x="1193" y="254" text-anchor="middle" class="node-sub" fill="currentColor">workflows / executions</text>

        <path d="M 1240 116 L 1240 340 L 95 340 L 95 116" fill="none" stroke="currentColor" stroke-dasharray="3 4" marker-end="url(#arrow1)" />
        <text x="640" y="356" text-anchor="middle" class="edge-label" fill="currentColor">λ api's response: GraphQL JSON → rendered HTML / RSC payload, back through API Gateway → Fargate → ALB → CloudFront</text>
      </svg>
      <figcaption>Orange boxes are kept warm (min 1 task, Provisioned Concurrency) — no scale-out cold start on the render path.</figcaption>
    </figure>
  </section>

  <section>
    <h2>Figure 2 <span class="tag">mutation → async job → live push</span></h2>
    <figure>
      <svg viewBox="0 0 1300 260" role="img" aria-label="On a mutation, the api Lambda enqueues a message to SQS instead of doing the work inline; a worker Lambda consumes it, updates DynamoDB, and publishes an event to AppSync Events, which pushes it over a WebSocket to the browser's already-open real-time connection.">
        <defs>
          <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
        </defs>

        <g stroke="currentColor" fill="none">
          <line x1="174" y1="88" x2="236" y2="88" marker-end="url(#arrow2)" />
          <line x1="394" y1="88" x2="456" y2="88" marker-end="url(#arrow2)" />
          <line x1="614" y1="88" x2="676" y2="88" marker-end="url(#arrow2)" />
          <line x1="834" y1="88" x2="896" y2="88" marker-end="url(#arrow2)" />
        </g>
        <text x="205" y="78" text-anchor="middle" class="edge-label" fill="currentColor">SendMessage</text>
        <text x="425" y="78" text-anchor="middle" class="edge-label" fill="currentColor">poll / trigger</text>
        <text x="645" y="78" text-anchor="middle" class="edge-label" fill="currentColor">UpdateItem</text>
        <text x="865" y="78" text-anchor="middle" class="edge-label" fill="currentColor">HTTP publish</text>

        <g>
          <rect x="20" y="60" width="154" height="56" rx="10" fill="none" stroke="var(--accent)" stroke-width="2" />
          <text x="97" y="80" text-anchor="middle" class="node-label" fill="currentColor">λ api : live</text>
          <text x="97" y="95" text-anchor="middle" class="node-sub" fill="currentColor">enqueues, returns</text>
        </g>
        <g>
          <rect x="236" y="60" width="158" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="315" y="80" text-anchor="middle" class="node-label" fill="currentColor">SQS</text>
          <text x="315" y="95" text-anchor="middle" class="node-sub" fill="currentColor">generation / execution</text>
        </g>
        <g>
          <rect x="456" y="60" width="158" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="535" y="80" text-anchor="middle" class="node-label" fill="currentColor">worker λ</text>
          <text x="535" y="95" text-anchor="middle" class="node-sub" fill="currentColor">ai-worker / execution</text>
        </g>
        <g>
          <rect x="676" y="60" width="158" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="755" y="80" text-anchor="middle" class="node-label" fill="currentColor">DynamoDB</text>
          <text x="755" y="95" text-anchor="middle" class="node-sub" fill="currentColor">status write</text>
        </g>
        <g>
          <rect x="896" y="60" width="158" height="56" rx="10" fill="none" stroke="currentColor" />
          <text x="975" y="80" text-anchor="middle" class="node-label" fill="currentColor">AppSync Events</text>
          <text x="975" y="95" text-anchor="middle" class="node-sub" fill="currentColor">channel namespace</text>
        </g>

        <path d="M 975 116 L 975 170 L 97 170 L 97 116" fill="none" stroke="currentColor" stroke-dasharray="3 4" marker-end="url(#arrow2)" />
        <text x="536" y="190" text-anchor="middle" class="edge-label" fill="currentColor">WebSocket push → browser's open AppSync Events subscription (not an HTTP response)</text>
        <rect x="20" y="206" width="154" height="44" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3" />
        <text x="97" y="232" text-anchor="middle" class="node-label" fill="currentColor">Browser (same tab)</text>
      </svg>
      <figcaption>Browser already holds a persistent WebSocket to AppSync Events, opened on page load — this arrow lands on that existing connection, not a new request.</figcaption>
    </figure>
  </section>
</main>
