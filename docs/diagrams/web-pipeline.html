<!doctype html>
<title>Web Deploy Pipeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --ink:#1b1d1f; --muted:#6b7074;
  --line:#d8d5cf; --accent:#2f6f4f; --accent-soft:#e3efe8;
  --warn:#b5752c; --warn-soft:#f4e8d8;
  --font-display:'Space Grotesk',ui-sans-serif,sans-serif;
  --font-body:'Inter',ui-sans-serif,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1d2023; --ink:#eceae6; --muted:#9a9fa3;
    --line:#32363a; --accent:#5fb98a; --accent-soft:#1e2e26;
    --warn:#e0a25a; --warn-soft:#352a1b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1d2023; --ink:#eceae6; --muted:#9a9fa3;
  --line:#32363a; --accent:#5fb98a; --accent-soft:#1e2e26;
  --warn:#e0a25a; --warn-soft:#352a1b; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  margin:0; padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.wrap{max-width:980px; margin:0 auto; padding-block:40px 64px}
h1{font-family:var(--font-display); font-size:clamp(22px,3vw,28px); margin:0 0 28px; text-wrap:balance}
figure{margin:0 0 36px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 16px}
figcaption{font-size:13px; color:var(--muted); margin-top:12px; padding:0 8px}
svg{width:100%; height:auto; display:block}
text{font-family:var(--font-mono); font-size:11px; fill:currentColor}
.lbl{font-family:var(--font-body); font-size:11.5px; fill:var(--muted)}
.title{font-family:var(--font-display); font-size:13px; fill:currentColor; font-weight:600}
@media (max-width:600px){ figure{padding:16px 10px} }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">

<div class="wrap">
  <h1>Web Deploy Pipeline</h1>

  <figure>
    <svg viewBox="0 0 940 260" role="img" aria-label="Pipeline: build and lint, then docker build and push to ECR, then register task definition, then update ECS service and sync S3, then invalidate CloudFront">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <g font-weight="600">
        <rect x="10" y="40" width="130" height="60" rx="8" fill="none" stroke="currentColor" opacity="0.5"/>
        <text x="75" y="65" text-anchor="middle" class="title">build + lint</text>
        <text x="75" y="82" text-anchor="middle" class="lbl">nx run-many</text>

        <rect x="190" y="40" width="150" height="60" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="265" y="65" text-anchor="middle" class="title" fill="var(--accent)">docker build</text>
        <text x="265" y="82" text-anchor="middle" class="lbl">push → ECR</text>

        <rect x="390" y="40" width="160" height="60" rx="8" fill="none" stroke="currentColor" opacity="0.5"/>
        <text x="470" y="65" text-anchor="middle" class="title">register task-def</text>
        <text x="470" y="82" text-anchor="middle" class="lbl">new revision, every run</text>

        <rect x="600" y="10" width="160" height="60" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/>
        <text x="680" y="35" text-anchor="middle" class="title" fill="var(--warn)">update ECS service</text>
        <text x="680" y="52" text-anchor="middle" class="lbl">rolling, force-new-deploy</text>

        <rect x="600" y="100" width="160" height="60" rx="8" fill="none" stroke="currentColor" opacity="0.5"/>
        <text x="680" y="125" text-anchor="middle" class="title">sync static → S3</text>
        <text x="680" y="142" text-anchor="middle" class="lbl">_next/static, public</text>

        <rect x="810" y="55" width="130" height="60" rx="8" fill="none" stroke="currentColor" opacity="0.5"/>
        <text x="875" y="80" text-anchor="middle" class="title">invalidate</text>
        <text x="875" y="97" text-anchor="middle" class="lbl">CloudFront /*</text>
      </g>

      <line x1="140" y1="70" x2="186" y2="70" stroke="currentColor" marker-end="url(#arrow)"/>
      <line x1="340" y1="70" x2="386" y2="70" stroke="currentColor" marker-end="url(#arrow)"/>
      <path d="M 550 55 L 596 40" stroke="currentColor" fill="none" marker-end="url(#arrow)"/>
      <path d="M 550 85 L 596 130" stroke="currentColor" fill="none" marker-end="url(#arrow)"/>
      <path d="M 760 55 L 806 75" stroke="currentColor" fill="none" marker-end="url(#arrow)"/>
      <path d="M 760 125 L 806 95" stroke="currentColor" fill="none" marker-end="url(#arrow)"/>

      <text x="10" y="200" class="lbl">wait for</text>
      <text x="10" y="216" class="lbl"><tspan fill="currentColor">ecs wait services-stable</tspan> before S3 sync + invalidation run</text>
    </svg>
    <figcaption>One job, one image build, two delivery targets: ECS (dynamic/SSR) and S3+CloudFront (static assets).</figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 900 220" role="img" aria-label="Rolling deploy: new task starts and passes health check, old and new both serve traffic through the ALB briefly, then the old task drains and stops">
      <defs>
        <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <rect x="20" y="80" width="140" height="56" rx="8" fill="none" stroke="currentColor" opacity="0.5"/>
      <text x="90" y="105" text-anchor="middle" class="title">ALB</text>
      <text x="90" y="122" text-anchor="middle" class="lbl">target group</text>

      <rect x="340" y="20" width="150" height="56" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/>
      <text x="415" y="45" text-anchor="middle" class="title" fill="var(--warn)">task v1 (old)</text>
      <text x="415" y="62" text-anchor="middle" class="lbl">draining → stops</text>

      <rect x="340" y="140" width="150" height="56" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/>
      <text x="415" y="165" text-anchor="middle" class="title" fill="var(--accent)">task v2 (new)</text>
      <text x="415" y="182" text-anchor="middle" class="lbl">healthy, steady-state</text>

      <path d="M 160 95 L 336 45" stroke="currentColor" fill="none" marker-end="url(#arrow2)"/>
      <path d="M 160 115 L 336 165" stroke="currentColor" fill="none" marker-end="url(#arrow2)"/>

      <text x="545" y="40" class="lbl">routed traffic, both</text>
      <text x="545" y="56" class="lbl">versions, few seconds</text>

      <line x1="600" y1="90" x2="760" y2="90" stroke="currentColor" opacity="0.4" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
      <text x="680" y="78" text-anchor="middle" class="lbl">deregistration delay</text>
      <rect x="760" y="60" width="120" height="56" rx="8" fill="none" stroke="currentColor" opacity="0.5"/>
      <text x="820" y="85" text-anchor="middle" class="title">v1 stopped</text>
      <text x="820" y="102" text-anchor="middle" class="lbl">only v2 remains</text>
    </svg>
    <figcaption>Rolling update, not blue/green: no second target group, just a brief in-place overlap.</figcaption>
  </figure>
</div>
