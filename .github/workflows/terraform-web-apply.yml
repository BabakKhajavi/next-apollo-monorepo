name: Terraform Web Apply

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform-web/**"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: terraform-web
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Protected environment in repo settings — configure required reviewers
    # there so this job pauses for manual approval before touching real
    # infra. Without that environment/reviewer configured, this runs
    # unattended on every merge to main.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::314146325814:role/github-terraform-web-apply
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Terraform Init
        working-directory: infra/terraform-web
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: infra/terraform-web
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_graphql_uri: ${{ vars.GRAPHQL_URI }}
